<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YTV</title>
<style>
  /* VIDAA lays web apps out at 1280x720 CSS pixels and scales them to the
     screen, so everything is sized for that. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e1116; color: #e8eef4; font: 16px/1.35 sans-serif; }
  ::-webkit-scrollbar { display: none; }
  #app { display: flex; gap: 20px; padding: 20px 24px; height: 100%; box-sizing: border-box; }
  #main { width: 800px; }
  h1 { font-size: 26px; margin: 0 0 10px; }
  h1 small { font-size: 14px; color: #8b98a5; font-weight: normal; }
  /* YouTube picks quality from the player's size. The player is always laid
     out at the full 1280x720 page (1080p on screen) and shrunk into its box,
     so it asks for 1080p even when it isn't full screen. */
  #stage { width: 800px; height: 450px; background: #000; position: relative; overflow: hidden; }
  #frame { width: 1280px; height: 720px; transform: scale(0.625); transform-origin: 0 0; }
  #player { width: 100%; height: 100%; display: block; }
  #hud { margin-top: 10px; font-size: 18px; color: #8fb8ff; }
  #help { margin-top: 8px; font-size: 14px; color: #8b98a5; }
  #side { flex: 1; font-size: 13px; }
  h2 { font-size: 15px; color: #8fb8ff; margin: 0 0 4px; }
  .row { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid #222a33; padding: 2px 0; }
  .k { color: #9aa7b4; } .v { text-align: right; overflow-wrap: anywhere; max-width: 65%; }
  .ok { color: #6fdc8c; } .bad { color: #ff7b72; }
  #keys { margin-top: 12px; }
  #toast { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); background: rgba(0,0,0,.85); padding: 8px 16px; border-radius: 6px; display: none; z-index: 3; }
  body.full #stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 2; }
  body.full #frame { width: 100vw; height: 100vh; transform: none; }
</style>
</head>
<body>
  <div id="app">
    <div id="main">
      <h1>YTV <small>Phase 0 · platform check</small></h1>
      <div id="stage"><div id="frame"><div id="player"></div></div></div>
      <div id="hud">Loading player…</div>
      <div id="help">OK play/pause · ←/→ seek 10 s · ↑/↓ speed · Red or 1: full screen · 2: next test video · Back twice: exit</div>
    </div>
    <div id="side">
      <h2>Checks</h2>
      <div id="checks"></div>
      <div id="keys"><h2>Remote keys seen</h2><div id="keylist"></div></div>
    </div>
  </div>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
