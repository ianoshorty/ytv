<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- Ask for a 1920-wide page so the app can draw at full 1080p. If the TV
     ignores this, app.js scales the 1280x720 layout to whatever it gets. -->
<meta name="viewport" content="width=1920">
<title>YTV</title>
</head>
<body>
  <div id="app">
    <div id="main">
      <h1>YTV <small>Phase 0 · platform check</small></h1>
      <div id="stage"><div id="frame"><div id="player"></div></div></div>
      <div id="hud">Loading player…</div>
      <div id="help">OK play/pause · ←/→ seek 10 s · ↑/↓ speed · Red or 1: full screen · 2: next test video · Back twice: exit</div>
    </div>
    <div id="side">
      <h2>Checks</h2>
      <div id="checks"></div>
      <div id="keys"><h2>Remote keys seen</h2><div id="keylist"></div></div>
    </div>
    <div id="toast"></div>
  </div>
  <script>
    // The TV keeps pages cached until a full restart, so load the app's code
    // and styles fresh on every launch.
    (function () {
      var t = Date.now();
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "app.css?t=" + t;
      document.head.appendChild(css);
      var js = document.createElement("script");
      js.src = "app.js?t=" + t;
      document.body.appendChild(js);
    })();
  </script>
</body>
</html>
