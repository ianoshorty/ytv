<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YTV</title>
</head>
<body>
  <div id="app">
    <nav id="rail"><div class="logo">YTV</div></nav>
    <main id="content"></main>
  </div>
  <div id="toast"></div>
  <div id="player-layer">
    <div id="player-frame"><div id="player"></div></div>
    <div id="hud">
      <div id="hud-top"><div id="hud-title"></div><div id="hud-meta"></div></div>
      <div id="hud-bottom">
        <div id="hud-bar"><div id="hud-fill"></div></div>
        <div id="hud-state"></div>
        <div id="hud-help">OK play/pause · ←/→ 10 s · ↑/↓ speed · 0–9 jump · Red info · Green captions · Yellow quality · Back close</div>
      </div>
    </div>
  </div>
  <script>
    // The TV keeps this page cached until a full restart, so everything else
    // (including the list of scripts, in boot.js) is fetched fresh each launch.
    window.YTV_BOOT_T = Date.now();
    var boot = document.createElement("script");
    boot.src = "boot.js?t=" + window.YTV_BOOT_T;
    document.body.appendChild(boot);
  </script>
</body>
</html>
