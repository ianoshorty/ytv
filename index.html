<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YTV</title>
</head>
<body>
  <div id="app">
    <nav id="rail"><div class="logo">YTV</div></nav>
    <main id="content"></main>
  </div>
  <div id="toast"></div>
  <div id="player-layer">
    <div id="player-frame"><div id="player"></div></div>
    <div id="hud">
      <div id="hud-top"><div id="hud-title"></div><div id="hud-meta"></div></div>
      <div id="hud-bottom">
        <div id="hud-bar"><div id="hud-fill"></div></div>
        <div id="hud-state"></div>
        <div id="hud-help">OK play/pause · ←/→ 10 s · ↑/↓ speed · 0–9 jump · Red info · Green captions · Yellow quality · Back close</div>
      </div>
    </div>
  </div>
  <script>
    // The TV keeps pages cached until a full restart, so load the app's code
    // and styles fresh on every launch. async=false keeps the scripts in order.
    (function () {
      var t = Date.now();
      var css = document.createElement("link");
      css.rel = "stylesheet";
      css.href = "app.css?t=" + t;
      document.head.appendChild(css);
      ["util", "api", "auth", "mock", "nav", "player", "screens", "main"].forEach(function (name) {
        var js = document.createElement("script");
        js.src = "js/" + name + ".js?t=" + t;
        js.async = false;
        document.body.appendChild(js);
      });
    })();
  </script>
</body>
</html>
