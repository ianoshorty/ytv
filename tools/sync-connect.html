<!doctype html><html lang="en"><meta charset="utf-8">
<meta name="referrer" content="no-referrer"><title>Connect YTV history sync</title>
<style>body{background:#151b27;color:white;font:23px/1.5 sans-serif;margin:25px}p{white-space:pre-wrap}</style>
<h2>YTV history sync</h2><p id="status">Waiting for the private setup page…</p>
<script src="../js/sync-core.js"></script><script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.hash.slice(1)), nonce = params.get('nonce'), expected = params.get('parent');
  var output = document.getElementById('status'), saved = false;
  function signal(type, extra) { window.parent.postMessage(Object.assign({ type: type, nonce: nonce }, extra || {}), '*'); }
  try {
    var u = new URL(expected);
    if (window.parent === window || !/^[A-Za-z0-9_-]{32,80}$/.test(nonce) || u.protocol !== 'https:' || u.origin !== expected ||
        !/^(192\.168\.\d{1,3}\.\d{1,3}|10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})$/.test(u.hostname)) throw new Error();
  } catch (_) { output.textContent = 'Setup error: invalid parent address. Return to the chat.'; signal('ytv-sync-error', { errorKind: 'INVALID_PARENT' }); return; }
  try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
  addEventListener('message', function (event) {
    if (saved || event.source !== window.parent || !event.data || event.data.type !== 'ytv-sync-session' || event.data.nonce !== nonce) return;
    if (event.origin !== expected) { output.textContent = 'Setup error: parent origin does not match. No session saved.'; signal('ytv-sync-error', { errorKind: 'PARENT_ORIGIN' }); return; }
    var phase = 'SESSION_VALIDATION';
    try {
      var session = window.YTVSyncCore.validateSession(event.data.session), text = JSON.stringify(session);
      phase = 'STORAGE';
      localStorage.setItem('ytv.syncEnabled', 'false');
      localStorage.setItem('ytv.syncSession', text);
      if (localStorage.getItem('ytv.syncSession') !== text) throw new Error();
      localStorage.removeItem('ytv.syncRemote');
      localStorage.removeItem('ytv.syncOutbox');
      saved = true;
      output.textContent = 'Session saved on this TV for YTV. Sync is paused until you enable it in Account.';
      signal('ytv-sync-connected', { saved: true });
    } catch (_) {
      output.textContent = 'Could not save the session. Sync was not enabled.';
      signal('ytv-sync-connected', { saved: false, errorKind: phase });
    }
  });
  var count = 0, timer = setInterval(function () {
    if (saved || ++count > 30) { clearInterval(timer); return; }
    // Only readiness/nonce/status messages use '*', never credentials. The
    // credential receiver above still requires the exact parent origin.
    signal('ytv-sync-ready', { coreAvailable: !!window.YTVSyncCore, secureContext: window.isSecureContext === true });
  }, 1000);
})();
</script></html>
